name: Update merged changelog

# When a .changes/v*.md file is modified in a release PR,
# we should update the root CHANGELOG.md.

on:
  pull_request:
    branches: [ 'main' ]

jobs:
  merge:
    name: Merge
    runs-on: ubuntu-latest

    # Run only if the PR is a release PR.
    if: >-
      contains(
        github.event.pull_request.labels.*.name,
        'prepare-release'
      )

    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        token: ${{ secrets.PAT }}  # for push

    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - run: changie merge

    - name: Push changes
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
      with:
        commit_message: Update CHANGELOG.md
        file_pattern: CHANGELOG.md
