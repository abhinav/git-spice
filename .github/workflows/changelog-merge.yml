name: Update merged changelog

# When a .changes/v*.md file is modified in a release PR,
# we should update the root CHANGELOG.md.

on:
  pull_request:
    branches: [ 'main' ]

jobs:
  merge:
    name: Merge
    runs-on: ubuntu-latest

    # Run only if the PR is a release PR.
    if: >-
      contains(
        github.event.pull_request.labels.*.name,
        'prepare-release'
      )

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        token: ${{ secrets.PAT }}  # for push

    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - run: changie merge

    - name: Push changes
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
      with:
        commit_message: Update CHANGELOG.md
        file_pattern: CHANGELOG.md
