name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. v1.2.3)
        required: false
        default: 'auto'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-pr:
    runs-on: ubuntu-latest
    name: Generate release PR

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - id: run
      run: |
        mise run release:prepare ${{ inputs.version }}
        mise run generate

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
      with:
        title: Release ${{ steps.run.outputs.latest }}
        branch: release/${{ steps.run.outputs.latest }}
        labels: prepare-release
        commit-message: Release ${{ steps.run.outputs.latest }}
        token: ${{ secrets.PAT }}
        body: ''
